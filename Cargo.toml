[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["kiln contributors"]
repository = "https://github.com/kiln-rs/kiln"
homepage = "https://github.com/kiln-rs/kiln"
keywords = ["build", "cache", "cargo", "daemon", "rust"]
categories = ["development-tools", "development-tools::build-utils"]

[workspace.dependencies]
kiln-core = { path = "crates/kiln-core", version = "0.1.0" }
kiln-manifest = { path = "crates/kiln-manifest", version = "0.1.0" }
kiln-resolve = { path = "crates/kiln-resolve", version = "0.1.0" }
kiln-store = { path = "crates/kiln-store", version = "0.1.0" }
kiln-build = { path = "crates/kiln-build", version = "0.1.0" }
kiln-daemon = { path = "crates/kiln-daemon", version = "0.1.0" }
kiln-live = { path = "crates/kiln-live", version = "0.1.0" }
kiln-live-macros = { path = "crates/kiln-live-macros", version = "0.1.0" }

anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
flate2 = "1"
fs_extra = "1"
landlock = "0.4"
libc = "0.2"
libloading = "0.8"
notify = "8"
owo-colors = "4"
proc-macro2 = "1"
quote = "1"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "json"] }
seccompiler = "0.5"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "extra-traits"] }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"
axum = "0.8"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# correctness and performance are non-negotiable
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = false
strip = "symbols"

# The profile CI benchmarks with: fully optimised, debug-friendly symbols.
[profile.dist]
inherits = "release"
lto = "fat"
debug = true
strip = "none"
